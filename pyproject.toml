[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-swing-options"
version = "0.1.0"
description = "Educational market analysis workspace"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["falcon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
